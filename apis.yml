apis:
- aid: deep-sentinel-store-commerce
  name: Deep Sentinel Store Commerce API (UCP over MCP)
  description: 'The agent-facing commerce surface of the Deep Sentinel store. A live,
    anonymous Model Context Protocol endpoint exposing thirteen catalog, cart, checkout
    and order tools, implementing the Universal Commerce Protocol 2026-04-08 as declared
    in the store''s own /.well-known/ucp merchant profile. A second MCP endpoint answers
    store policy and FAQ questions. Both are Shopify commerce infrastructure operating
    under Deep Sentinel''s own domain and merchant identity; they are the only
    machine-readable API surface the company serves.'
  humanURL: https://shop.deepsentinel.com/
  baseURL: https://shop.deepsentinel.com/api/ucp/mcp
