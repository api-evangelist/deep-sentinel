aid: deep-sentinel
name: Deep Sentinel
description: 'Deep Sentinel is a US security company that pairs on-camera AI with live
  human guards. Its computer-vision models flag activity at the edge and hand the clip
  to a remote "LiveSentinel" operator who reviews it in seconds and intervenes over the
  camera''s two-way speaker to deter a crime before it happens, escalating to law
  enforcement when required. The company sells wireless and wired camera packs for homes
  and businesses alongside a monthly Live Guard monitoring subscription, and has extended
  guard service to third-party cameras — including a 2026 integration with Ubiquiti
  UniFi Protect built on Ubiquiti''s Official Protect API. On the security product itself
  Deep Sentinel is a consumer of other vendors'' APIs rather than a publisher: it runs no
  developer program, ships no client SDKs, and exposes no machine-readable contract. The
  one callable surface it does serve is its Shopify-backed store, which answers anonymous
  Model Context Protocol calls and implements the Universal Commerce Protocol.'
