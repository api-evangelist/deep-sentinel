    No idempotency key, header, or request-deduplication contract is present in any of
    the 14 probed tool inputSchemas, and none is documented. complete_checkout is
    therefore not safely retryable by contract; the buyer-approval step is the only
    guard against a duplicate purchase. No Idempotency pointer is emitted.
money:
  representation: integer minor units paired with an ISO 4217 currency code
  example: '{"amount": 2500, "currency": "USD"} is $25.00'
  agent_rule: divide by 100 for two-decimal currencies before quoting a price to a buyer;
    zero-decimal currencies such as JPY are already whole units
