  /deepsentinel/json both return 404. The github.com/deepsentinel organization is real
  and active (29 public repositories, most recent push 2026-08-10) but every repository
  is a FORK of third-party open source the company uses internally — baresip, dlib,
  mmdetection, transformers, react-native-webrtc, python-ws-discovery, VerneMQ — with no
  Deep Sentinel SDK, no OpenAPI, and no published client among them. Deep Sentinel ships
  consumer mobile apps (iOS and Android), which are end-user applications rather than
  developer packages and are recorded under distribution below rather than as packages.
